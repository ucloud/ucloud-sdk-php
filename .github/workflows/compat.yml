name: Compat

# 兼容性检查：composer.json 声明 `"php": ">=5.6"`，`make compatible` 用
# PHPCompatibility 以 testVersion 5.6 实扫 src/，是这条下界唯一的真实验证手段。
# 此前没有任何 CI 在跑它，下界等于只是写在 composer.json 里的一句声明。
#
# 只挂 schedule + workflow_dispatch，**不要**加 pull_request / push：
# 兼容性回归不该阻断日常 PR，而且 codegen PR 上多出一个 check 会干扰自动合并判定。
# 门禁归 ci.yml 的 ci-gate，这里只做定期体检。

on:
  schedule:
    # 每周一 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatible:
    name: compatible
    runs-on: ubuntu-latest
    # 不设 strategy.fail-fast：testVersion 由 Makefile 固定为 5.6，全仓只跑这一次
    # `make compatible`，没有矩阵可言；fail-fast 是矩阵内部的取消策略，单 job 无意义。
    # 将来若要按多个 testVersion 铺开，再在这里加 matrix + fail-fast: false。
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: composer install --prefer-dist --no-progress
      - run: make compatible
